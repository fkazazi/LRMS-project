<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" >
<head>
    <title>Admin View</title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
    <style>
        body,h1,h2,h3,h4,h5 {font-family: "Raleway", sans-serif}
        .w3-third img{margin-bottom: -6px; opacity: 0.8; cursor: pointer}
        .w3-third img:hover{opacity: 1}
    </style>
<body class="w3-light-grey w3-content" style="max-width:1600px">
<nav class="w3-sidebar w3-bar-block w3-white w3-animate-left w3-text-grey w3-collapse w3-top w3-center" style="z-index:3;width:300px;font-weight:bold" id="mySidebar"><br>
    <h3 class="w3-padding-64 w3-center"><b>WELCOME<br>ADMIN</b></h3>
    <a th:href="@{/api/admin/manage-users}" class="w3-bar-item w3-button">VIEW USERS</a>
    <a th:href="@{/api/admin/add-user}" class="w3-bar-item w3-button">ADD USER</a>
    <a th:href="@{/api/change-password}" class="w3-bar-item w3-button">CHANGE PASSWORD</a>
    <a th:href="@{/logout}" class="w3-bar-item w3-button">LOG OUT</a>
</nav>

<div class="w3-main" style="margin-left:350px; margin-right: 50px; margin-top: 50px;">
    <div class="w3-center w3-padding-32">
        <div class="w3-container w3-light-grey w3-padding-32 w3-padding-large" id="contact">
            <div class="w3-content" style="max-width:600px">
                <h4 class="w3-center"><b>Add New User</b></h4>
                <form action="#" th:action="@{/api/admin/save-user}" th:object="${user}" method="post">
                    <div class="w3-section">
                        <label>First Name</label>
                        <input class="w3-input w3-border" type="text" name="firstName" th:field="*{firstName}" required>
                        <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
                    </div><div class="w3-section">
                        <label>Last Name</label>
                        <input class="w3-input w3-border" type="text" name="LastName" th:field="*{lastName}" required>
                        <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
                    </div>
                    <div class="w3-section">
                        <label>Email</label>
                        <input class="w3-input w3-border" type="text" name="Email" th:field="*{email}" required>
                        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                    </div>
                    <div class="w3-section">
                        <label>Password</label>
                        <input class="w3-input w3-border" type="password" name="Password" th:field="*{password}" required minlength="8" autocomplete="new-password">
                        <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                    </div>
                    <div class="w3-section">
                        <label>Role</label>
                        <select class="w3-input" th:field="*{role}" required>
                            <option value="" disabled th:selected="${user.role == null}">Select role</option>
                            <option th:each="roleOption : ${T(com.lhind.AnnualLeaveApp.security.ApplicationRoles).values()}"
                                    th:value="${roleOption}"
                                    th:text="${roleOption}">
                            </option>
                        </select>
                        <span th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></span>
                    </div>
                    <div class="w3-section">
                        <label>Department</label>
                        <select class="w3-input" th:field="*{department}" required>
                            <option value="" disabled th:selected="${user.department == null}">Select department</option>
                            <option th:each="dept : ${T(com.lhind.AnnualLeaveApp.model.Department).values()}"
                                    th:value="${dept}"
                                    th:text="${dept}">
                            </option>
                        </select>
                        <span th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></span>
                    </div>
                    <button type="submit" class="w3-button w3-block w3-black w3-margin-bottom">Create</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
